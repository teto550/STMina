# Builds and publishes to GitHub Pages on every push to main. One-time setup needed in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (instead of "Deploy from a branch").
# Once that is set, this replaces `npm run deploy:ghpages` (which pushes a local build to the gh-pages branch) --
# GitHub itself runs the build now, so `gh-pages` branch is no longer needed for Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci` failed here with an "ajv-formats" lockfile mismatch that a from-scratch `npm install` does NOT
      # reproduce locally (2026-09-28); most likely a stale/corrupt runner npm cache, so caching is left off here
      # and `npm install` is used (still exact per the committed lockfile: package.json/-lock.json are unchanged).
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # .env.local is git-ignored (never committed), so the build needs these from GitHub Actions repository
          # secrets instead: Settings -> Secrets and variables -> Actions -> New repository secret, one per name
          # below, values copied from your local .env.local. VITE_APPCHECK_DEBUG_TOKEN is dev-only and deliberately
          # left out (baking a debug App Check bypass token into a public build would defeat App Check).
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_PUSH_WORKER_URL: ${{ secrets.VITE_PUSH_WORKER_URL }}
          VITE_ASSISTANT_WORKER_URL: ${{ secrets.VITE_ASSISTANT_WORKER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
