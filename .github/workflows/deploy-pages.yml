# Builds and publishes to GitHub Pages on every push to main. One-time setup needed in the repo:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (instead of "Deploy from a branch").
# Once that is set, this replaces `npm run deploy:ghpages` (which pushes a local build to the gh-pages branch) --
# GitHub itself runs the build now, so `gh-pages` branch is no longer needed for Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # pinned to match the npm version the lockfile was generated with locally: a newer npm on the runner
      # was stricter about an optional nested dependency (ajv-formats) and refused `npm ci` (2026-09-28).
      - run: npm install -g npm@10.8.2
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
